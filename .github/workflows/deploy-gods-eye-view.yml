name: Deploy God's Eye View to GitHub Pages

on:
  push:
    branches: [claude/gracious-fermat-hk49s8]
    paths: [gods-eye-view/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: gods-eye-view
        run: npm install
      - name: Build
        working-directory: gods-eye-view
        run: npx vite build --base=/experiment/
      - name: Fix Cesium asset path
        # vite-plugin-cesium copies its runtime assets to dist/<base>/cesium
        # instead of dist/cesium, which 404s once GitHub Pages serves dist/
        # as the site root under /experiment/. Move them back in place.
        working-directory: gods-eye-view
        run: |
          mv dist/experiment/cesium dist/cesium
          rm -rf dist/experiment
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gods-eye-view/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
